secret_configs:
- from:
    ops-mirror.pem:
      field: cert-key.pem
      item: mirror.openshift.com
    rh-cdn.pem:
      field: rh-cdn.pem
      item: rh-cdn
  to:
  - cluster_groups:
    - build_farm
    name: mirror.openshift.com
    namespace: ocp
- from:
    insights-live.yaml:
      field: insights-live.yaml
      item: insights-ci-account
    pull-secret:
      dockerconfigJSON:
      - auth_field: token_image-puller_app.ci_reg_auth_value.txt
        item: build_farm
        registry_url: registry.ci.openshift.org
    ssh-privatekey:
      field: ssh-privatekey
      item: openstack
  to:
  - cluster_groups:
    - non_app_ci
    name: cluster-secrets-openstack-vexxhost
    namespace: some-random-ns
user_secrets_target_clusters:
- app.ci
- build01
- build02
- build03
- build04
- build05
- build06
- build07
- build08
- build09
- build10
- build11
- build12
- core-ci
- hosted-mgmt
