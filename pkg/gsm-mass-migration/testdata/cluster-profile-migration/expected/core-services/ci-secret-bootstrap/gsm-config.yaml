dptp_collection: test-platform-infra

bundles:
  - name: hive-hive-credentials
    gsm_secrets:
        - collection: test-platform-infra
          group: build_farm
          fields:
            - name: sa--dot--hive--dot--hosted-mgmt--dot--config
              as: kubeconfig
            - name: sa--dot--hive--dot--hosted-mgmt--dot--token--dot--txt
    sync_to_cluster: true
    targets:
      - cluster_groups: [ non_app_ci ]
        namespace: ci
      - cluster_groups: [ non_app_ci ]
        namespace: test-credentials

  - gsm_secrets:
    - collection: hypershift-agent-ibmz-credentials
      group: abi-pull-secret
    - collection: hypershift-agent-ibmz-credentials
      group: brew-token
    - collection: hypershift-agent-ibmz-credentials
      group: httpd-vsi-ip
    - collection: hypershift-agent-ibmz-credentials
      group: httpd-vsi-key
    - collection: hypershift-agent-ibmz-credentials
      group: httpd-vsi-pub-key
    - collection: hypershift-agent-ibmz-credentials
      group: ibmcloud-apikey
    - collection: hypershift-agent-ibmz-credentials
      group: ibmcloud-zcomm-apikey
    - collection: hypershift-agent-ibmz-credentials
      group: quay-token
    name: hypershift-agent-ibmz-credentials

  - dockerconfig:
      as: pull-secret
      registries:
      - auth_field: token_image-puller_app--dot--ci_reg_auth_value--dot--txt
        group: build_farm
        registry_url: registry.ci.openshift.org
      - auth_field: auth
        email_field: email
        group: cloud--dot--openshift--dot--com-pull-secret
        registry_url: cloud.openshift.com
      - auth_field: auth
        email_field: email
        group: quay--dot--io-pull-secret
        registry_url: quay.io
      - auth_field: auth
        group: quayio-ci-read-only-robot
        registry_url: quay-proxy.ci.openshift.org
      - auth_field: auth
        group: quayio-ci-read-only-robot
        registry_url: quay.io/openshift/ci
      - auth_field: auth
        email_field: email
        group: registry--dot--connect--dot--redhat--dot--com-pull-secret
        registry_url: registry.connect.redhat.com
      - auth_field: auth
        email_field: email
        group: registry--dot--redhat--dot--io-pull-secret
        registry_url: registry.redhat.io
    gsm_secrets:
    - collection: test-platform-infra
      fields:
      - as: .awscred
        name: --dot--awscred
      - name: aws-account-id
      - as: sso-client-secret
        name: ocm-developer-productivity-staging--dot--token
      - as: sso-client-id
        name: ocm-developer-productivity-staging--dot--user
      group: cluster-bot-osd-ephemeral
    - collection: osd-team
      group: osd-extra-creds
    - collection: osd-team
      group: osd-shared-creds
    name: cluster-secrets-osd-ephemeral
    sync_to_cluster: true
    targets:
    - cluster_groups:
      - non_app_ci
      namespace: ci
    - cluster_groups:
      - non_app_ci
      namespace: test-credentials

  - dockerconfig:
      as: pull-secret
      registries:
      - auth_field: token_image-puller_app--dot--ci_reg_auth_value--dot--txt
        group: build_farm
        registry_url: registry.ci.openshift.org
      - auth_field: auth
        email_field: email
        group: cloud--dot--openshift--dot--com-pull-secret
        registry_url: cloud.openshift.com
    gsm_secrets:
    - collection: test-platform-infra
      fields:
      - as: .awscred
        name: --dot--awscred
      group: openshift-ci-aws-credentials
    name: cluster-secrets-azure-arm64
    sync_to_cluster: true
    targets:
    - cluster_groups:
      - non_app_ci
      namespace: ci

  - dockerconfig:
      as: pull-secret
      registries:
      - auth_field: token_image-puller_app--dot--ci_reg_auth_value--dot--txt
        group: build_farm
        registry_url: registry.ci.openshift.org
      - auth_field: auth
        email_field: email
        group: cloud--dot--openshift--dot--com-pull-secret
        registry_url: cloud.openshift.com
    gsm_secrets:
    - collection: test-platform-infra
      fields:
      - as: .awscred
        name: --dot--awscred
      group: openshift-ci-aws-credentials
    name: cluster-secrets-azure4
    sync_to_cluster: true
    targets:
    - cluster_groups:
      - non_app_ci
      namespace: ci

  - dockerconfig:
      as: pull-secret
      registries:
      - auth_field: token_image-puller_app--dot--ci_reg_auth_value--dot--txt
        group: build_farm
        registry_url: registry.ci.openshift.org
      - auth_field: auth
        group: quayio-ci-read-only-robot
        registry_url: quay-proxy.ci.openshift.org
    name: cluster-secrets-packet
    sync_to_cluster: true
    targets:
    - cluster_groups:
      - non_app_ci
      namespace: ci

  - dockerconfig:
      as: pull-secret
      registries:
      - auth_field: token_image-puller_app--dot--ci_reg_auth_value--dot--txt
        group: build_farm
        registry_url: registry.ci.openshift.org
      - auth_field: auth
        email_field: email
        group: cloud--dot--openshift--dot--com-pull-secret
        registry_url: cloud.openshift.com
    gsm_secrets:
    - collection: test-platform-infra
      fields:
      - as: .awscred
        name: --dot--awscred
      group: openshift-ci-aws-credentials
    - collection: test-platform-infra
      fields:
      - as: vmc.secret.auto.tfvars
        name: vmc--dot--secret--dot--auto--dot--tfvars
      group: vsphere-credentials
    name: cluster-secrets-vsphere
    sync_to_cluster: true
    targets:
    - cluster_groups:
      - non_app_ci
      namespace: ci

  - dockerconfig:
      as: pull-secret
      registries:
      - auth_field: token_image-puller_app--dot--ci_reg_auth_value--dot--txt
        group: build_farm
        registry_url: registry.ci.openshift.org
    gsm_secrets:
    - collection: test-platform-infra
      fields:
      - as: ca-cert.pem
        name: ca-cert--dot--pem
      - as: clouds.yaml
        name: clouds--dot--yaml
      - name: ssh-privatekey
      - name: ssh-publickey
      group: openstack-ppc64le
    name: cluster-secrets-openstack-ppc64le
    sync_to_cluster: true
    targets:
    - cluster_groups:
      - non_app_ci
      namespace: ci
    - cluster_groups:
      - non_app_ci
      namespace: test-credentials

  - gsm_secrets:
    - collection: openshift-qe
      group: ibmcloud-qe-2
    - collection: openshift-qe
      group: other-credentials
    name: cluster-secrets-ibmcloud-qe-2
    sync_to_cluster: true
    targets:
    - cluster_groups:
      - user_secrets_target_clusters
      namespace: ci
