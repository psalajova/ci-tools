secret_configs:
- from:
    ops-mirror.pem:
      field: cert-key.pem
      item: mirror.openshift.com
    rh-cdn.pem:
      field: rh-cdn.pem
      item: rh-cdn
  to:
  - cluster_groups:
    - build_farm
    name: mirror.openshift.com
    namespace: ocp
- from: #one profile per secret_config entry, dockerconfig + only dptp secrets (no user secret)
    .awscred:
      field: .awscred
      item: cluster-bot-osd-ephemeral
    aws-account-id:
      field: aws-account-id
      item: cluster-bot-osd-ephemeral
    pull-secret:
      dockerconfigJSON:
      - auth_field: token_image-puller_app.ci_reg_auth_value.txt
        item: build_farm
        registry_url: registry.ci.openshift.org
      - auth_field: auth
        email_field: email
        item: cloud.openshift.com-pull-secret
        registry_url: cloud.openshift.com
      - auth_field: auth
        email_field: email
        item: quay.io-pull-secret
        registry_url: quay.io
      - auth_field: auth
        item: quayio-ci-read-only-robot
        registry_url: quay-proxy.ci.openshift.org
      - auth_field: auth
        item: quayio-ci-read-only-robot
        registry_url: quay.io/openshift/ci
      - auth_field: auth
        email_field: email
        item: registry.connect.redhat.com-pull-secret
        registry_url: registry.connect.redhat.com
      - auth_field: auth
        email_field: email
        item: registry.redhat.io-pull-secret
        registry_url: registry.redhat.io
    sso-client-id:
      field: ocm-developer-productivity-staging.user
      item: cluster-bot-osd-ephemeral
    sso-client-secret:
      field: ocm-developer-productivity-staging.token
      item: cluster-bot-osd-ephemeral
  to:
  - cluster_groups:
    - non_app_ci
    name: cluster-secrets-osd-ephemeral
    namespace: ci
  - cluster_groups:
    - non_app_ci
    name: cluster-secrets-osd-ephemeral
    namespace: test-credentials
# V2: shared from block, two profiles from one entry
- from:
    .awscred:
      field: .awscred
      item: openshift-ci-aws-credentials
    pull-secret:
      dockerconfigJSON:
      - auth_field: token_image-puller_app.ci_reg_auth_value.txt
        item: build_farm
        registry_url: registry.ci.openshift.org
      - auth_field: auth
        email_field: email
        item: cloud.openshift.com-pull-secret
        registry_url: cloud.openshift.com
  to:
  - cluster_groups:
    - non_app_ci
    name: cluster-secrets-azure4
    namespace: ci
  - cluster_groups:
    - non_app_ci
    name: cluster-secrets-azure-arm64
    namespace: ci
# V3: dockerconfig only, no DPTP fields or user secrets
- from:
    pull-secret:
      dockerconfigJSON:
      - auth_field: token_image-puller_app.ci_reg_auth_value.txt
        item: build_farm
        registry_url: registry.ci.openshift.org
      - auth_field: auth
        item: quayio-ci-read-only-robot
        registry_url: quay-proxy.ci.openshift.org
  to:
  - cluster_groups:
    - non_app_ci
    name: cluster-secrets-packet
    namespace: ci
- from: #secret override: cluster-secrets-vsphere is used by vsphere-multizone-2, vsphere-connected-2, etc.
    .awscred:
      field: .awscred
      item: openshift-ci-aws-credentials
    pull-secret:
      dockerconfigJSON:
      - auth_field: token_image-puller_app.ci_reg_auth_value.txt
        item: build_farm
        registry_url: registry.ci.openshift.org
      - auth_field: auth
        email_field: email
        item: cloud.openshift.com-pull-secret
        registry_url: cloud.openshift.com
    vmc.secret.auto.tfvars:
      field: vmc.secret.auto.tfvars
      item: vsphere-credentials
  to:
  - cluster_groups:
    - non_app_ci
    name: cluster-secrets-vsphere
    namespace: ci
- from:
    insights-live.yaml:
      field: insights-live.yaml
      item: insights-ci-account
    pull-secret:
      dockerconfigJSON:
      - auth_field: token_image-puller_app.ci_reg_auth_value.txt
        item: build_farm
        registry_url: registry.ci.openshift.org
    ssh-privatekey:
      field: ssh-privatekey
      item: openstack
  to:
  - cluster_groups:
    - non_app_ci
    name: cluster-secrets-openstack-vexxhost
    namespace: some-random-ns
#trying something
- from:
    ca-cert.pem:
      field: ca-cert.pem
      item: openstack-ppc64le
    clouds.yaml:
      field: clouds.yaml
      item: openstack-ppc64le
    pull-secret:
      dockerconfigJSON:
      - auth_field: token_image-puller_app.ci_reg_auth_value.txt
        item: build_farm
        registry_url: registry.ci.openshift.org
    ssh-privatekey:
      field: ssh-privatekey
      item: openstack-ppc64le
    ssh-publickey:
      field: ssh-publickey
      item: openstack-ppc64le
  to:
  - cluster_groups:
    - non_app_ci
    name: cluster-secrets-openstack-ppc64le
    namespace: ci
  - cluster_groups:
    - non_app_ci
    name: cluster-secrets-openstack-ppc64le
    namespace: test-credentials
