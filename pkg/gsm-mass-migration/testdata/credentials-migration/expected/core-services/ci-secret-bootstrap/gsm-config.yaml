dptp_collection: test-platform-infra

bundles:
  - name: hive-hive-credentials
    gsm_secrets:
        - collection: test-platform-infra
          group: build_farm
          fields:
            - name: sa--dot--hive--dot--hosted-mgmt--dot--config
              as: kubeconfig
            - name: sa--dot--hive--dot--hosted-mgmt--dot--token--dot--txt
    sync_to_cluster: true
    targets:
      - cluster_groups: [ non_app_ci ]
        namespace: ci
      - cluster_groups: [ non_app_ci ]
        namespace: test-credentials

  - gsm_secrets:
    - collection: hypershift-agent-ibmz-credentials
      group: abi-pull-secret
    - collection: hypershift-agent-ibmz-credentials
      group: brew-token
    - collection: hypershift-agent-ibmz-credentials
      group: httpd-vsi-ip
    - collection: hypershift-agent-ibmz-credentials
      group: httpd-vsi-key
    - collection: hypershift-agent-ibmz-credentials
      group: httpd-vsi-pub-key
    - collection: hypershift-agent-ibmz-credentials
      group: ibmcloud-apikey
    - collection: hypershift-agent-ibmz-credentials
      group: ibmcloud-zcomm-apikey
    - collection: hypershift-agent-ibmz-credentials
      group: quay-token
    name: hypershift-agent-ibmz-credentials
