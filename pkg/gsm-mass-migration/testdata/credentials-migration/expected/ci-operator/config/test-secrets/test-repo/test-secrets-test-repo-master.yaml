build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.25-openshift-4.21
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: test-with-secret
  commands: make test
  container:
    from: src
  secrets:
  - mount_path: /opt/app-root/my-secrets
    collection: my-test-collection
    group: my-test-secret
- as: test-with-bundle-secret
  commands: make test
  container:
    from: src
  secrets:
  - mount_path: /opt/app-root/bundle-secrets
    bundle: hypershift-agent-ibmz-credentials
- as: test-with-multiple-secrets
  commands: make test
  container:
    from: src
  secrets:
  - mount_path: /opt/app-root/first
    collection: my-test-collection
    group: my-test-secret
  - mount_path: /opt/app-root/second
    collection: another-collection
    group: another-test-secret
- as: test-already-migrated
  commands: make test
  container:
    from: src
  secrets:
  - collection: some-collection
    group: some-group
    mount_path: /opt/app-root/migrated
zz_generated_metadata:
  branch: master
  org: test-secrets
  repo: test-repo
